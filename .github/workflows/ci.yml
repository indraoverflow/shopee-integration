name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: secrets stay out of the repository
        # A committed token store is worse than a leaked key: it holds a live
        # refresh token per shop. Fail here rather than after the push.
        run: |
          git check-ignore -q .env || { echo ".env is not ignored"; exit 1; }
          git check-ignore -q data/tokens.json || { echo "data/ is not ignored"; exit 1; }
          echo "ignore rules cover .env and data/"
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: the built server starts and answers /health
        run: |
          PARTNER_ID=1 PARTNER_KEY=test PORT=3111 node dist/server.js &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3111/health > /dev/null; then
              curl -fsS http://127.0.0.1:3111/health
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not answer /health"
          exit 1
